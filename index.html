<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>11Б Ирцийн мэдээлэл</title>

<!-- html2canvas -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

:root{
  --bg:#080a0f;
  --card:#10141d;
  --card2:#151a25;
  --text:#f4f6fb;
  --muted:#8f98aa;
  --accent:#7c5cff;

  --green:#20c997;
  --green-bg:#10261f;

  --red:#ff5252;
  --red-bg:#291317;

  --yellow:#ffc857;
  --yellow-bg:#29230f;

  --border:#252a36;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
}


/* =====================================================
   SIDEBAR
===================================================== */

.sidebar{
  width:245px;
  background:rgba(12,14,20,.98);
  border-right:1px solid var(--border);

  padding:24px 16px;

  position:fixed;
  top:0;
  left:0;

  height:100vh;

  z-index:999;

  transition:transform .25s ease;
}

.sidebar.hidden{
  transform:translateX(-100%);
}

.nav{
  margin-top:65px;

  display:flex;
  flex-direction:column;

  gap:10px;
}

.nav button{
  width:100%;

  padding:14px 15px;

  border:1px solid transparent;
  border-radius:12px;

  background:transparent;

  color:#dce1ec;

  text-align:left;

  font-size:15px;

  cursor:pointer;

  transition:.2s;
}

.nav button:hover{
  background:#151a25;
}

.nav button.active{
  background:#1a2030;
  border-color:#30384a;
  color:#fff;
}


/* =====================================================
   MENU BUTTON
===================================================== */

.menu-btn{
  position:fixed;

  top:18px;
  left:18px;

  z-index:2000;

  width:45px;
  height:45px;

  border:1px solid #303746;
  border-radius:12px;

  background:#10141d;

  color:#fff;

  font-size:22px;

  cursor:pointer;

  box-shadow:0 5px 20px rgba(0,0,0,.25);
}

.menu-btn:hover{
  background:#181e2a;
}


/* =====================================================
   MAIN
   Sidebar гарсан ч ҮНДСЭН хэсэг жижигрэхгүй
===================================================== */

.main{
  margin-left:0;

  width:100%;

  min-height:100vh;

  padding:30px;

  max-width:none;
}


/* =====================================================
   PAGE
===================================================== */

.page{
  display:none;
}

.page.active{
  display:block;
}


/* =====================================================
   HEADER
===================================================== */

.header{
  margin:40px auto 25px;

  max-width:1200px;
}

.header h1{
  margin:0 0 8px;

  font-size:32px;
}

.header p{
  margin:0;

  color:var(--muted);
}


/* =====================================================
   STATS
===================================================== */

.stats{
  max-width:1200px;

  margin:0 auto 20px;

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:14px;
}

.stat{
  background:var(--card);

  border:1px solid var(--border);

  border-radius:16px;

  padding:18px;

  overflow:hidden;
}

.stat .label{
  color:var(--muted);

  font-size:13px;

  margin-bottom:8px;
}

.stat .number{
  font-size:27px;

  font-weight:700;
}


/* Дээд 4 статистикийн өнгө */

.stat.total{
  border-top:3px solid var(--accent);
}

.stat.present{
  border-top:3px solid var(--green);
}

.stat.absent{
  border-top:3px solid var(--red);
}

.stat.free{
  border-top:3px solid var(--yellow);
}

.stat.present .number{
  color:var(--green);
}

.stat.absent .number{
  color:var(--red);
}

.stat.free .number{
  color:var(--yellow);
}


/* =====================================================
   CARD
===================================================== */

.card{
  max-width:1200px;

  margin:0 auto 20px;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  overflow:hidden;
}

.card-head{
  padding:18px;

  border-bottom:1px solid var(--border);

  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  flex-wrap:wrap;
}

.card-head h2{
  margin:0;

  font-size:18px;
}

.controls{
  display:flex;

  gap:10px;

  flex-wrap:wrap;
}


/* =====================================================
   INPUT / SELECT
===================================================== */

input,
select{
  background:#0c1018;

  border:1px solid #303746;

  color:#fff;

  border-radius:10px;

  padding:11px 13px;

  outline:none;
}

input:focus,
select:focus{
  border-color:var(--accent);
}


/* =====================================================
   BUTTON
===================================================== */

button{
  font-family:inherit;
}

.primary{
  border:0;

  background:var(--accent);

  color:#fff;

  border-radius:10px;

  padding:11px 15px;

  cursor:pointer;

  font-weight:600;
}

.primary:hover{
  opacity:.9;
}


/* =====================================================
   TABLE
===================================================== */

.table-wrap{
  width:100%;

  overflow-x:auto;
}

table{
  width:100%;

  border-collapse:collapse;

  min-width:650px;
}

th,
td{
  padding:14px 16px;

  border-bottom:1px solid #202531;

  text-align:left;
}

th{
  color:var(--muted);

  font-size:13px;

  font-weight:600;
}

td{
  font-size:14px;
}


/* =====================================================
   STATUS BUTTONS
===================================================== */

.status{
  display:flex;

  gap:7px;

  flex-wrap:wrap;
}

.status button{
  padding:7px 11px;

  border-radius:8px;

  cursor:pointer;

  font-size:12px;

  font-weight:600;

  transition:.15s;
}


/* ---------- ИРСЭН ---------- */

.status-present{
  color:var(--green);

  background:var(--green-bg);

  border:1px solid #1d755c;
}

.status-present:hover{
  background:#16372d;
}

.status-present.active{
  background:var(--green);

  border-color:var(--green);

  color:#06130f;
}


/* ---------- ТАСАЛСАН ---------- */

.status-absent{
  color:var(--red);

  background:var(--red-bg);

  border:1px solid #75323a;
}

.status-absent:hover{
  background:#3a191e;
}

.status-absent.active{
  background:var(--red);

  border-color:var(--red);

  color:#180507;
}


/* ---------- ЧӨЛӨӨТЭЙ ---------- */

.status-free{
  color:var(--yellow);

  background:var(--yellow-bg);

  border:1px solid #80672c;
}

.status-free:hover{
  background:#3b3215;
}

.status-free.active{
  background:var(--yellow);

  border-color:var(--yellow);

  color:#171100;
}


/* History дээр дарах боломжгүй */

.status button:disabled{
  cursor:default;

  opacity:.95;
}


/* =====================================================
   EMPTY
===================================================== */

.empty{
  text-align:center;

  color:var(--muted);

  padding:35px;
}


/* =====================================================
   ADMIN
===================================================== */

.admin-box{
  max-width:1200px;

  margin:0 auto;

  background:var(--card);

  border:1px solid var(--border);

  border-radius:18px;

  padding:20px;
}

.add-box{
  display:flex;

  gap:10px;

  margin-bottom:20px;
}

.add-box input{
  flex:1;
}

.student-row{
  display:flex;

  justify-content:space-between;

  align-items:center;

  gap:15px;

  padding:13px 0;

  border-bottom:1px solid #202531;
}

.delete{
  border:1px solid #572f36;

  background:#28161a;

  color:#ff8b96;

  padding:7px 11px;

  border-radius:8px;

  cursor:pointer;
}


/* =====================================================
   MODAL
===================================================== */

.modal{
  position:fixed;

  inset:0;

  background:rgba(0,0,0,.7);

  display:none;

  align-items:center;

  justify-content:center;

  z-index:3000;

  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;

  max-width:380px;

  background:#10141d;

  border:1px solid #303746;

  border-radius:18px;

  padding:24px;
}

.modal-box h2{
  margin-top:0;
}

.modal-box input{
  width:100%;

  margin:12px 0;
}

.modal-actions{
  display:flex;

  gap:10px;
}

.modal-actions button{
  flex:1;
}

.cancel{
  border:1px solid #303746;

  background:#151a25;

  color:#fff;

  border-radius:10px;

  padding:11px;

  cursor:pointer;
}

.error{
  color:#ff6975;

  font-size:13px;

  min-height:18px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width:700px){

  .main{
    padding:18px 12px;
  }

  .header{
    margin-top:75px;
  }

  .header h1{
    font-size:25px;
  }

  .stats{
    grid-template-columns:
      repeat(2,1fr);
  }

  .stat{
    padding:14px;
  }

  .stat .number{
    font-size:23px;
  }

  .card-head{
    align-items:stretch;
  }

  .controls{
    width:100%;
  }

  .controls input,
  .controls select,
  .controls button{
    width:100%;
  }

  .add-box{
    flex-direction:column;
  }

}


/* =====================================================
   EXPORT
===================================================== */

.export-container{
  position:fixed;

  left:-100000px;

  top:0;
}

</style>
</head>


<body>


<!-- =====================================================
     MENU
===================================================== -->

<!-- =====================================================

<main class="main">


<!-- =====================================================
     HOME

<section

  <!-- STATS -->

    <div class="stat absent">

<!-- =====================================================

<section

  <div class="header">

    </h1>

    <p id="historyTitle">

    </div>

    </div>


    <div class="stat absent">

        class="number"

      </div>

    <div class="stat free">

      <div class="label">

        <tbody

<!-- =====================================================
     ADMIN
===================================================== -->

<section
  id="admin"
  class="page">


  <div class="header">

    <h1>

    <p>

</main>

</div>


<!-- =====================================================
     LOGIN MODAL
===================================================== -->

<div
  class="modal"
  id="loginModal">


  <div class="modal-box">


    <h2>
      🔐 Admin нэвтрэх
    </h2>


    <p style="color:#8f98aa;">

      Admin нууц үгээ оруулна уу.

        Нэвтрэх

<script>


/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {

  apiKey:
    "AIzaSyDJvrEO4oMfEZVa81hW7ciC_KlaE0cl9aA",

  authDomain:
    "b-irts.firebaseapp.com",

  databaseURL:
    "https://b-irts-default-rtdb.asia-southeast1.firebasedatabase.app",

  projectId:
    "b-irts",

  storageBucket:
    "b-irts.firebasestorage.app",

  messagingSenderId:
    "812154469314",

  appId:
    "1:812154469314:web:9cb88abcdf1afc74a9b45b",

  measurementId:
    "G-KSPCFLVDC5"

};


firebase.initializeApp(
  firebaseConfig
);


const db =
  firebase.database();


const studentsRef =
  db.ref(
    "class11B/students"
  );


const attendanceRef =
  db.ref(
    "class11B/attendance"
  );


/* =====================================================
   INITIAL STUDENTS
===================================================== */

const initialStudents = [

  "Анхбаяр",
  "Анужин",
  "Баасаннэмэх",
  "Ганбаатар",
  "Догсүнжав",
  "Дөлбадрах",
  "Мандуухай",
  "Мөнхсарнай",
  "Мөнх-Амьдрал",
  "Н-Нандин-Эрдэнэ",
  "Ү-Нандин-Эрдэнэ",
  "Б-Нандин-Эрдэнэ",
  "Ууганцэцэг",
  "Сэрдамба",
  "Сүрэнхорлоо",
  "Очиржав",
  "Шинэбаяр",
  "Төрболд",
  "Төгөлдөр",
  "Пүрэвваанчиг",
  "Хан-Учрал",
  "Халиунаа",
  "Хатанзориг",
  "Хөгжилболд",
  "Хулан",
  "Чандмань-Эрдэнэ",
  "Чингүүн",
  "Цэлмүүн",
  "Энх-Уянга",
  "Энх-Орчлон",
  "Энхмэнд"

];


const ADMIN_PASSWORD =
  "0020";


let students =
  [...initialStudents];


let attendance =
  {};


/* =====================================================
   DATE
===================================================== */

function dateKey(){

  return new Date()
    .toISOString()
    .slice(0,10);

}


function todayText(){

  return new Date()
    .toLocaleDateString(
      "mn-MN",
      {
        year:"numeric",
        month:"long",
        day:"numeric",
        weekday:"long"
      }
    );

}


document.getElementById(
  "today"
).textContent =
  todayText();


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar(){

  const sidebar =
    document.getElementById(
      "sidebar"
    );

  sidebar.classList.toggle(
    "hidden"
  );

}


/* =====================================================
   PAGE SWITCH
===================================================== */

function showPage(page){

  document
    .querySelectorAll(".page")
    .forEach(
      item =>
        item.classList.remove(
          "active"
        )
    );


  document
    .getElementById(page)
    .classList.add(
      "active"
    );


  document
    .getElementById("homeNav")
    .classList.toggle(
      "active",
      page === "home"
    );


  document
    .getElementById("historyNav")
    .classList.toggle(
      "active",
      page === "history"
    );


  document
    .getElementById("adminNav")
    .classList.toggle(
      "active",
      page === "admin"
    );


  if(page === "home"){

    renderAttendance();

  }


  if(page === "history"){

    renderHistoryDates();

    renderHistory();

  }


  if(page === "admin"){

    renderAdmin();

  }


  /* Сонгосны дараа Sidebar хаана */

  document
    .getElementById("sidebar")
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   STATUS CLASS
===================================================== */

function statusClass(status){

  if(
    status === "Ирсэн"
  ){

    return "status-present";

  }


  if(
    status === "Тасалсан"
  ){

    return "status-absent";

  }


  if(
    status === "Чөлөөтэй"
  ){

    return "status-free";

  }


  return "";

}


/* =====================================================
   ATTENDANCE
===================================================== */

function key(){

  return dateKey();

}


function getToday(){

  return attendance[
    key()
  ] || {};

}


async function setStatus(
  name,
  status
){

  if(
    !attendance[key()]
  ){

    attendance[key()] = {};

  }


  attendance[key()][name] =
    status;


  try{

    await attendanceRef
      .child(key())
      .child(name)
      .set(status);


    renderAttendance();

  }

  catch(error){

    console.error(
      error
    );

    alert(
      "Ирц бүртгэхэд алдаа гарлаа."
    );

  }

}


/* =====================================================
   RENDER ATTENDANCE
===================================================== */

function renderAttendance(){

  const search =
    document.getElementById(
      "search"
    );


  const query =
    (
      search.value ||
      ""
    )
    .toLowerCase()
    .trim();


  const data =
    getToday();


  const body =
    document.getElementById(
      "attendanceBody"
    );


  const filtered =
    students.filter(
      student =>
        student
          .toLowerCase()
          .includes(query)
    );


  body.innerHTML =
    filtered
      .map(
        (student,index) => {

          const status =
            data[student] ||
            "Ирсэн";


          return `

            <tr>

              <td>
                ${index + 1}
              </td>


              <td>
                <b>
                  ${escapeHtml(student)}
                </b>
              </td>


              <td>

                <div class="status">


                  <button
                    type="button"
                    class="
                      status-present
                      ${status === "Ирсэн" ? "active" : ""}
                    "
                    onclick="
                      setStatus(
                        '${escapeJs(student)}',
                        'Ирсэн'
                      )
                    ">

                    Ирсэн

                  </button>


                  <button
                    type="button"
                    class="

/* =====================================================
   HISTORY
===================================================== */

function formatHistoryDate(
  date
){

  const d =
    new Date(
      date +
      "T00:00:00"
    );


  return d.toLocaleDateString(
    "mn-MN",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"long"
    }
  );

}


function renderHistoryDates(){

  const select =
    document.getElementById(
      "historyDate"
    );


  const today =
    new Date();


  const dates =
    Object.keys(
      attendance || {}
    )
    .filter(
      date => {

        if(
          !/^\d{4}-\d{2}-\d{2}$/
            .test(date)
        ){

          return false;

        }


        const d =
          new Date(
            date +
            "T00:00:00"
          );


        const diff =
          Math.floor(
            (
              today - d
            ) /
            (
              1000 *
              60 *
              60 *
              24
            )
          );


        return (
          diff >= 0 &&
          diff <= 30
        );

      }
    )
    .sort()
    .reverse();


  if(
    dates.length === 0
  ){

    select.innerHTML = `

      <option value="">

        Сүүлийн 30 хоногт
        ирц алга

      </option>

    `;

    return;

  }


  const current =
    select.value;


  select.innerHTML =
    dates
      .map(
        date => `

          <option value="${date}">

            ${formatHistoryDate(date)}

          </option>

        `
      )
      .join("");


  if(
    dates.includes(current)
  ){

    select.value =
      current;

  }
  else{

    select.value =
      dates[0];

  }

}


function renderHistory(){

  const select =
    document.getElementById(
      "historyDate"
    );


  const date =
    select.value;


  const body =
    document.getElementById(
      "historyBody"
    );


  if(!date){

    body.innerHTML = `

      <tr>

        <td
          colspan="3"
          class="empty">

          Сүүлийн 30 хоногт
          ирц бүртгэгдээгүй байна.

        </td>

      </tr>

    `;


    document.getElementById(
      "historyTotal"
    ).textContent = 0;


    document.getElementById(
      "historyPresent"
    ).textContent = 0;


    document.getElementById(
      "historyAbsent"
    ).textContent = 0;


    document.getElementById(
      "historyFree"
    ).textContent = 0;


    return;

  }


  const data =
    attendance[date] || {};


  document.getElementById(
    "historyTitle"
  ).textContent =
    formatHistoryDate(date) +
    " — Ирц";


  let present = 0;

  let absent = 0;

  let free = 0;


  body.innerHTML =
    students
      .map(
        (student,index) => {

          const status =
            data[student] ||
            "Ирсэн";


          if(
            status === "Ирсэн"
          ){

            present++;

          }


          if(
            status === "Тасалсан"
          ){

            absent++;

          }


          if(
            status === "Чөлөөтэй"
          ){

            free++;

          }


          return `

            <tr>

              <td>
                ${index + 1}
              </td>


              <td>
                <b>
                  ${escapeHtml(student)}
                </b>
              </td>


              <td>

                <div class="status">


                  <button
                    type="button"
                    disabled
                    class="
                      status-present
                      ${status === "Ирсэн" ? "active" : ""}
                    ">

                    Ирсэн

                  </button>


                  <button
                    type="button"
                    disabled
                    class="
                      status-absent
                      ${status === "Тасалсан" ? "active" : ""}
                    ">

                    Тасалсан

                  </button>


                  <button
                    type="button"
                    disabled
                    class="
                      status-free
                      ${status === "Чөлөөтэй" ? "active" : ""}
                    ">

                    Чөлөөтэй

                  </button>


                </div>

              </td>

            </tr>

          `;

        }
      )
      .join("");


  document.getElementById(
    "historyTotal"
  ).textContent =
    students.length;


  document.getElementById(
    "historyPresent"
  ).textContent =
    present;


  document.getElementById(
    "historyAbsent"
  ).textContent =
    absent;


  document.getElementById(
    "historyFree"
  ).textContent =
    free;

}

async function addStudent(){

  const input =
    document.getElementById(
      "newStudent"
    );


  const name =
    input.value.trim();


  if(!name){

    alert(
      "Сурагчийн нэр оруулна уу."
    );

    return;

  }


  if(
    students.some(
      student =>
        student
          .toLowerCase() ===
        name.toLowerCase()
    )
  ){

    alert(
      "Энэ нэр бүртгэлтэй байна."
    );

    return;

  }


  try{

    await studentsRef.set(
      [
        ...students,
        name
      ]
    );


    input.value = "";

  }

  catch(error){

    console.error(
      error
    );

    alert(
      "Сурагч нэмэхэд алдаа гарлаа."
    );

  }

}


async function removeStudent(
  name
){

  if(
    !confirm(
      name +
      " -ийг жагсаалтаас хасах уу?"
    )
  ){

    return;

  }


  try{

    await studentsRef.set(
      students.filter(
        student =>
          student !== name
      )
    );

  }

  catch(error){

    console.error(
      error
    );

    alert(
      "Сурагч хасахад алдаа гарлаа."
    );

  }

}

/* =====================================================
   ESCAPE
===================================================== */

function escapeJs(text){

  return text
    .replace(
      /\\/g,
      "\\\\"
    )
    .replace(
      /'/g,
      "\\'"
    );

}


function escapeHtml(text){

  return text
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );

}
