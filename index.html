<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>11Б Ирцийн мэдээлэл</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>
:root{
  --bg:#080a0f;
  --card:#10141d;
  --card2:#151a25;
  --text:#f4f6fb;
  --muted:#8f98aa;
  --accent:#7c5cff;
  --green:#20c997;
  --red:#ff5c5c;
  --yellow:#ffc857;
  --border:#252a36;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:var(--bg);
  color:var(--text);
}

body{
  overflow-x:hidden;
}

/* ================= SIDEBAR ================= */

.sidebar{
  width:245px;
  background:rgba(12,14,20,.97);
  border-right:1px solid var(--border);
  padding:24px 16px;
  position:fixed;
  top:0;
  left:0;
  height:100vh;
  z-index:999;
  transition:transform .25s ease;
}

.sidebar.hidden{
  transform:translateX(-100%);
}

.nav{
  margin-top:65px;
  display:flex;
  flex-direction:column;
  gap:10px;
}

.nav button{
  width:100%;
  padding:14px 15px;
  border:1px solid transparent;
  border-radius:12px;
  background:transparent;
  color:#dce1ec;
  text-align:left;
  font-size:15px;
  cursor:pointer;
  transition:.2s;
}

.nav button:hover{
  background:#151a25;
}

.nav button.active{
  background:#1a2030;
  border-color:#30384a;
  color:#fff;
}

/* ================= MENU BUTTON ================= */

.menu-btn{
  position:fixed;
  top:18px;
  left:18px;
  z-index:2000;
  width:45px;
  height:45px;
  border:1px solid #303746;
  border-radius:12px;
  background:#10141d;
  color:#fff;
  font-size:22px;
  cursor:pointer;
}

.menu-btn:hover{
  background:#181e2a;
}

/* ================= MAIN ================= */

.main{
  margin-left:245px;
  width:calc(100% - 245px);
  min-height:100vh;
  padding:30px;
  max-width:1400px;
  transition:margin-left .25s ease,width .25s ease;
}

.main.full{
  margin-left:0;
  width:100%;
  max-width:none;
}

/* ================= PAGE ================= */

.page{
  display:none;
}

.page.active{
  display:block;
}

/* ================= HEADER ================= */

.header{
  margin:40px auto 25px;
  max-width:1200px;
}

.header h1{
  margin:0 0 8px;
  font-size:32px;
}

.header p{
  margin:0;
  color:var(--muted);
}

/* ================= STATS ================= */

.stats{
  max-width:1200px;
  margin:0 auto 20px;
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.stat{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  padding:18px;
}

.stat .label{
  color:var(--muted);
  font-size:13px;
  margin-bottom:8px;
}

.stat .number{
  font-size:27px;
  font-weight:700;
}

/* ================= CARD ================= */

.card{
  max-width:1200px;
  margin:0 auto 20px;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
}

.card-head{
  padding:18px;
  border-bottom:1px solid var(--border);
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  flex-wrap:wrap;
}

.card-head h2{
  margin:0;
  font-size:18px;
}

.controls{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

input,
select{
  background:#0c1018;
  border:1px solid #303746;
  color:#fff;
  border-radius:10px;
  padding:11px 13px;
  outline:none;
}

input:focus,
select:focus{
  border-color:var(--accent);
}

/* ================= BUTTON ================= */

button{
  font-family:inherit;
}

.primary{
  border:0;
  background:var(--accent);
  color:white;
  border-radius:10px;
  padding:11px 15px;
  cursor:pointer;
  font-weight:600;
}

.primary:hover{
  opacity:.9;
}

/* ================= TABLE ================= */

.table-wrap{
  width:100%;
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:650px;
}

th,
td{
  padding:14px 16px;
  border-bottom:1px solid #202531;
  text-align:left;
}

th{
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}

td{
  font-size:14px;
}

.status{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.status button{
  border:1px solid #303746;
  background:#111620;
  color:#aeb6c6;
  padding:7px 10px;
  border-radius:8px;
  cursor:pointer;
  font-size:12px;
}

.status button.active{
  background:#252c3b;
  border-color:#56617a;
  color:#fff;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:35px;
}

/* ================= ADMIN ================= */

.admin-box{
  max-width:1200px;
  margin:0 auto;
  background:var(--card);
  border:1px solid var(--border);
  border-radius:18px;
  padding:20px;
}

.add-box{
  display:flex;
  gap:10px;
  margin-bottom:20px;
}

.add-box input{
  flex:1;
}

.student-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
  padding:13px 0;
  border-bottom:1px solid #202531;
}

.delete{
  border:1px solid #572f36;
  background:#28161a;
  color:#ff8b96;
  padding:7px 11px;
  border-radius:8px;
  cursor:pointer;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.7);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:3000;
  padding:20px;
}

.modal.show{
  display:flex;
}

.modal-box{
  width:100%;
  max-width:380px;
  background:#10141d;
  border:1px solid #303746;
  border-radius:18px;
  padding:24px;
}

.modal-box h2{
  margin-top:0;
}

.modal-box input{
  width:100%;
  margin:12px 0;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-actions button{
  flex:1;
}

.cancel{
  border:1px solid #303746;
  background:#151a25;
  color:#fff;
  border-radius:10px;
  padding:11px;
  cursor:pointer;
}

.error{
  color:#ff6975;
  font-size:13px;
  min-height:18px;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

  .main{
    padding:18px 12px;
  }

  .header{
    margin-top:75px;
  }

  .header h1{
    font-size:25px;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .stat{
    padding:14px;
  }

  .stat .number{
    font-size:23px;
  }

  .card-head{
    align-items:stretch;
  }

  .controls{
    width:100%;
  }

  .controls input,
  .controls select,
  .controls button{
    width:100%;
  }

  .add-box{
    flex-direction:column;
  }

}
</style>
</head>

<body>

<!-- MENU -->
<button class="menu-btn" onclick="toggleSidebar()">☰</button>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar hidden" id="sidebar">

    <div class="nav">

      <button id="homeNav"
              class="active"
              onclick="showPage('home')">
        🏠 &nbsp; Home
      </button>

      <button id="historyNav"
              onclick="showPage('history')">
        📅 &nbsp; Өмнөх ирц
      </button>

      <button id="adminNav"
              onclick="openAdmin()">
        🦹🏻‍♂️ &nbsp; Admin
      </button>

    </div>

  </aside>

  <!-- MAIN -->
  <main class="main full">

    <!-- ================= HOME ================= -->

    <section id="home" class="page active">

      <div class="header">
        <h1>11Б ирцийн мэдээлэл</h1>
        <p id="today"></p>
      </div>

      <div class="stats">

        <div class="stat">
          <div class="label">Нийт сурагч</div>
          <div class="number" id="total">0</div>
        </div>

        <div class="stat">
          <div class="label">Ирсэн</div>
          <div class="number" id="present">0</div>
        </div>

        <div class="stat">
          <div class="label">Тасалсан</div>
          <div class="number" id="absent">0</div>
        </div>

        <div class="stat">
          <div class="label">Чөлөөтэй</div>
          <div class="number" id="free">0</div>
        </div>

      </div>

      <div class="card">

        <div class="card-head">

          <h2>Өнөөдрийн ирц</h2>

          <div class="controls">

            <input
              id="search"
              type="text"
              placeholder="Сурагч хайх..."
              oninput="renderAttendance()"
            >

            <button
              class="primary"
              onclick="downloadAttendanceImage()">
              📸 Зураг татах
            </button>

          </div>

        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>#</th>
                <th>Сурагч</th>
                <th>Ирц</th>
              </tr>
            </thead>

            <tbody id="attendanceBody"></tbody>

          </table>

        </div>

      </div>

    </section>


    <!-- ================= HISTORY ================= -->

    <section id="history" class="page">

      <div class="header">

        <h1>Өмнөх ирц</h1>

        <p id="historyTitle">
          Өмнөх өдрийн ирц
        </p>

      </div>

      <div class="stats">

        <div class="stat">
          <div class="label">Нийт сурагч</div>
          <div class="number" id="historyTotal">0</div>
        </div>

        <div class="stat">
          <div class="label">Ирсэн</div>
          <div class="number" id="historyPresent">0</div>
        </div>

        <div class="stat">
          <div class="label">Тасалсан</div>
          <div class="number" id="historyAbsent">0</div>
        </div>

        <div class="stat">
          <div class="label">Чөлөөтэй</div>
          <div class="number" id="historyFree">0</div>
        </div>

      </div>

      <div class="card">

        <div class="card-head">

          <h2>Ирц сонгох</h2>

          <select
            id="historyDate"
            onchange="renderHistory()">
          </select>

        </div>

        <div class="table-wrap">

          <table>

            <thead>
              <tr>
                <th>#</th>
                <th>Сурагч</th>
                <th>Ирц</th>
              </tr>
            </thead>

            <tbody id="historyBody"></tbody>

          </table>

        </div>

      </div>

    </section>


    <!-- ================= ADMIN ================= -->

    <section id="admin" class="page">

      <div class="header">

        <h1>Admin</h1>

        <p>Сурагчдын жагсаалтыг удирдах</p>

      </div>

      <div class="admin-box">

        <div class="add-box">

          <input
            id="newStudent"
            type="text"
            placeholder="Шинэ сурагчийн нэр">

          <button
            class="primary"
            onclick="addStudent()">
            + Нэмэх
          </button>

        </div>

        <h3>
          Сурагчид
          <span id="adminCount">(0)</span>
        </h3>

        <div id="adminList"></div>

      </div>

    </section>

  </main>

</div>


<!-- ================= LOGIN MODAL ================= -->

<div class="modal" id="loginModal">

  <div class="modal-box">

    <h2>🔐 Admin нэвтрэх</h2>

    <p style="color:#8f98aa;">
      Admin нууц үгээ оруулна уу.
    </p>

    <input
      id="adminPassword"
      type="password"
      placeholder="Нууц үг"
      onkeydown="if(event.key==='Enter') checkAdmin()">

    <div
      id="loginError"
      class="error">
    </div>

    <div class="modal-actions">

      <button
        class="cancel"
        onclick="closeLogin()">
        Болих
      </button>

      <button
        class="primary"
        onclick="checkAdmin()">
        Нэвтрэх
      </button>

    </div>

  </div>

</div>


<script>

/* =====================================================
   FIREBASE
===================================================== */

const firebaseConfig = {
  apiKey: "AIzaSyDJvrEO4oMfEZVa81hW7ciC_KlaE0cl9aA",
  authDomain: "b-irts.firebaseapp.com",
  databaseURL: "https://b-irts-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "b-irts",
  storageBucket: "b-irts.firebasestorage.app",
  messagingSenderId: "812154469314",
  appId: "1:812154469314:web:9cb88abcdf1afc74a9b45b",
  measurementId: "G-KSPCFLVDC5"
};

firebase.initializeApp(firebaseConfig);

const db = firebase.database();

const studentsRef =
  db.ref("class11B/students");

const attendanceRef =
  db.ref("class11B/attendance");


/* =====================================================
   INITIAL STUDENTS
===================================================== */

const initialStudents = [
  "Анхбаяр",
  "Анужин",
  "Баасаннэмэх",
  "Ганбаатар",
  "Догсүнжав",
  "Дөлбадрах",
  "Мандуухай",
  "Мөнхсарнай",
  "Мөнх-Амьдрал",
  "Н Нандин-Эрдэнэ",
  "Ү Нандин-Эрдэнэ",
  "Б Нандин-Эрдэнэ",
  "Ууганцэцэг",
  "Сэрдамба",
  "Сүрэнхорлоо",
  "Очиржав",
  "Шинэбаяр",
  "Төрболд",
  "Төгөлдөр",
  "Пүрэвваанчиг",
  "Хан-Учрал",
  "Халиунаа",
  "Хатанзориг",
  "Хөгжилболд",
  "Хулан",
  "Чандмань-Эрдэнэ",
  "Чингүүн",
  "Цэлмүүн",
  "Энх-Уянга",
  "Энх-Орчлон",
  "Энхмэнд"
];

const ADMIN_PASSWORD = "0020";

let students = [...initialStudents];
let attendance = {};
let dataReady = false;


/* =====================================================
   DATE
===================================================== */

function dateKey(){
  return new Date()
    .toISOString()
    .slice(0,10);
}

function todayText(){
  return new Date().toLocaleDateString(
    "mn-MN",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"long"
    }
  );
}

document.getElementById("today").textContent =
  todayText();


/* =====================================================
   SIDEBAR
===================================================== */

function toggleSidebar(){

  const sidebar =
    document.getElementById("sidebar");

  const main =
    document.querySelector(".main");

  sidebar.classList.toggle("hidden");
  main.classList.toggle("full");

}


/* =====================================================
   PAGE SWITCH
===================================================== */

function showPage(p){

  document
    .querySelectorAll(".page")
    .forEach(x =>
      x.classList.remove("active")
    );

  document
    .getElementById(p)
    .classList.add("active");


  document
    .getElementById("homeNav")
    .classList.toggle(
      "active",
      p === "home"
    );

  document
    .getElementById("historyNav")
    .classList.toggle(
      "active",
      p === "history"
    );

  document
    .getElementById("adminNav")
    .classList.toggle(
      "active",
      p === "admin"
    );


  if(p === "home"){

    renderAttendance();

  }
  else if(p === "history"){

    renderHistoryDates();
    renderHistory();

  }
  else if(p === "admin"){

    renderAdmin();

  }


  /* ⭐ Page сонгосны дараа Sidebar автоматаар хаагдана */

  const sidebar =
    document.getElementById("sidebar");

  const main =
    document.querySelector(".main");

  sidebar.classList.add("hidden");
  main.classList.add("full");

}


/* =====================================================
   ATTENDANCE
===================================================== */

function key(){
  return dateKey();
}

function getToday(){
  return attendance[key()] || {};
}


async function setStatus(name,status){

  if(!attendance[key()])
    attendance[key()] = {};

  attendance[key()][name] = status;

  try{

    await attendanceRef
      .child(key())
      .child(name)
      .set(status);

    renderAttendance();

  }
  catch(e){

    console.error(e);

    alert(
      "Ирц бүртгэхэд алдаа гарлаа."
    );

  }

}


/* =====================================================
   RENDER ATTENDANCE
===================================================== */

function renderAttendance(){

  const search =
    document.getElementById("search");

  const q =
    (search.value || "")
      .toLowerCase()
      .trim();

  const data =
    getToday();

  const body =
    document.getElementById(
      "attendanceBody"
    );

  const filtered =
    students.filter(s =>
      s.toLowerCase().includes(q)
    );


  body.innerHTML =
    filtered.map((s,i)=>{

      const status =
        data[s] || "Ирсэн";

      return `
        <tr>

          <td>${i + 1}</td>

          <td>
            <b>${escapeHtml(s)}</b>
          </td>

          <td>

            <div class="status">

              ${[
                "Ирсэн",
                "Тасалсан",
                "Чөлөөтэй"
              ].map(x => `

                <button
                  class="${status === x ? "active" : ""}"
                  onclick="setStatus('${escapeJs(s)}','${x}')">

                  ${x}

                </button>

              `).join("")}

            </div>

          </td>

        </tr>
      `;

    }).join("");


  if(!filtered.length){

    body.innerHTML = `
      <tr>
        <td
          colspan="3"
          class="empty">
          Сурагч олдсонгүй.
        </td>
      </tr>
    `;

  }


  updateStats();

}


/* =====================================================
   STATS
===================================================== */

function updateStats(){

  const data =
    getToday();

  document.getElementById("total")
    .textContent =
    students.length;

  document.getElementById("present")
    .textContent =
    students.filter(
      s => (data[s] || "Ирсэн")
      === "Ирсэн"
    ).length;

  document.getElementById("absent")
    .textContent =
    students.filter(
      s => data[s] === "Тасалсан"
    ).length;

  document.getElementById("free")
    .textContent =
    students.filter(
      s => data[s] === "Чөлөөтэй"
    ).length;

}


/* =====================================================
   HISTORY - LAST 30 DAYS
===================================================== */

function formatHistoryDate(date){

  const d =
    new Date(date + "T00:00:00");

  return d.toLocaleDateString(
    "mn-MN",
    {
      year:"numeric",
      month:"long",
      day:"numeric",
      weekday:"long"
    }
  );

}


function renderHistoryDates(){

  const select =
    document.getElementById(
      "historyDate"
    );

  const today =
    new Date();

  const dates =
    Object.keys(attendance || {})
      .filter(date => {

        if(!/^\d{4}-\d{2}-\d{2}$/.test(date))
          return false;

        const d =
          new Date(date + "T00:00:00");

        const diff =
          Math.floor(
            (today - d) /
            (1000 * 60 * 60 * 24)
          );

        return diff >= 0 && diff <= 30;

      })
      .sort()
      .reverse();


  if(!dates.length){

    select.innerHTML =
      `<option value="">
        Сүүлийн 30 хоногт ирц алга
      </option>`;

    return;

  }


  const current =
    select.value;

  select.innerHTML =
    dates.map(date => `
      <option value="${date}">
        ${formatHistoryDate(date)}
      </option>
    `).join("");


  if(dates.includes(current)){

    select.value = current;

  }
  else{

    select.value = dates[0];

  }

}


/* =====================================================
   HISTORY RENDER
===================================================== */

function renderHistory(){

  const select =
    document.getElementById(
      "historyDate"
    );

  const date =
    select.value;

  const body =
    document.getElementById(
      "historyBody"
    );


  if(!date){

    body.innerHTML = `
      <tr>
        <td
          colspan="3"
          class="empty">
          Сүүлийн 30 хоногт
          ирц бүртгэгдээгүй байна.
        </td>
      </tr>
    `;

    document.getElementById(
      "historyTotal"
    ).textContent = 0;

    document.getElementById(
      "historyPresent"
    ).textContent = 0;

    document.getElementById(
      "historyAbsent"
    ).textContent = 0;

    document.getElementById(
      "historyFree"
    ).textContent = 0;

    return;

  }


  const data =
    attendance[date] || {};


  document.getElementById(
    "historyTitle"
  ).textContent =
    formatHistoryDate(date) +
    " — Ирц";


  let present = 0;
  let absent = 0;
  let free = 0;


  body.innerHTML =
    students.map((s,i)=>{

      const status =
        data[s] || "Ирсэн";


      if(status === "Ирсэн")
        present++;

      if(status === "Тасалсан")
        absent++;

      if(status === "Чөлөөтэй")
        free++;


      return `
        <tr>

          <td>${i + 1}</td>

          <td>
            <b>${escapeHtml(s)}</b>
          </td>

          <td>

            <div class="status">

              <button
                class="${status === "Ирсэн" ? "active" : ""}"
                disabled>
                Ирсэн
              </button>

              <button
                class="${status === "Тасалсан" ? "active" : ""}"
                disabled>
                Тасалсан
              </button>

              <button
                class="${status === "Чөлөөтэй" ? "active" : ""}"
                disabled>
                Чөлөөтэй
              </button>

            </div>

          </td>

        </tr>
      `;

    }).join("");


  document.getElementById(
    "historyTotal"
  ).textContent =
    students.length;

  document.getElementById(
    "historyPresent"
  ).textContent =
    present;

  document.getElementById(
    "historyAbsent"
  ).textContent =
    absent;

  document.getElementById(
    "historyFree"
  ).textContent =
    free;

}


/* =====================================================
   ADMIN
===================================================== */

async function addStudent(){

  const input =
    document.getElementById(
      "newStudent"
    );

  const name =
    input.value.trim();


  if(!name){

    alert(
      "Сурагчийн нэр оруулна уу."
    );

    return;

  }


  if(
    students.some(
      s =>
      s.toLowerCase() ===
      name.toLowerCase()
    )
  ){

    alert(
      "Энэ нэр бүртгэлтэй байна."
    );

    return;

  }


  try{

    await studentsRef.set(
      [...students,name]
    );

    input.value = "";

  }
  catch(e){

    console.error(e);

    alert(
      "Сурагч нэмэхэд алдаа гарлаа."
    );

  }

}


async function removeStudent(name){

  if(
    !confirm(
      name +
      " -ийг жагсаалтаас хасах уу?"
    )
  )
    return;


  try{

    await studentsRef.set(
      students.filter(
        s => s !== name
      )
    );

  }
  catch(e){

    console.error(e);

    alert(
      "Сурагч хасахад алдаа гарлаа."
    );

  }

}


function renderAdmin(){

  document.getElementById(
    "adminCount"
  ).textContent =
    "(" + students.length + ")";


  document.getElementById(
    "adminList"
  ).innerHTML =

    students.map((s,i)=>`

      <div class="student-row">

        <span>
          ${i + 1}.
          <b>${escapeHtml(s)}</b>
        </span>

        <button
          class="delete"
          onclick="removeStudent('${escapeJs(s)}')">

          Хасах

        </button>

      </div>

    `).join("");

}

/* =====================================================
   IMAGE DOWNLOAD
   iPhone + Android + PC
===================================================== */

async function downloadAttendanceImage(){

  const home =
    document.getElementById("home");


  if(!home){

    alert(
      "Ирцийн хэсэг олдсонгүй."
    );

    return;

  }


  try{

    if(typeof html2canvas === "undefined"){

      alert(
        "Зураг үүсгэгч ачаалагдаагүй байна."
      );

      return;

    }


    window.scrollTo(0,0);


    const canvas =
      await html2canvas(home,{

        backgroundColor:"#080a0f",

        scale:
          Math.min(
            window.devicePixelRatio || 2,
            2
          ),

        useCORS:true,

        allowTaint:false,

        logging:false,

        imageTimeout:15000

      });


    canvas.toBlob(
      async function(blob){

        if(!blob){

          alert(
            "Зураг үүсгэж чадсангүй."
          );

          return;

        }


        const fileName =
          "11B-irts-" +
          dateKey() +
          ".png";


        /* 📱 iPhone / Android */

        if(
          navigator.share &&
          navigator.canShare
        ){

          const file =
            new File(
              [blob],
              fileName,
              {
                type:"image/png"
              }
            );


          try{

            if(
              navigator.canShare({
                files:[file]
              })
            ){

              await navigator.share({

                files:[file],

                title:
                  "11Б ирцийн мэдээлэл"

              });

              return;

            }

          }
          catch(shareError){

            if(
              shareError.name ===
              "AbortError"
            ){

              return;

            }

          }

        }


        /* 💻 PC / Browser fallback */

        const url =
          URL.createObjectURL(blob);


        const link =
          document.createElement("a");

        link.href = url;

        link.download =
          fileName;


        document.body.appendChild(link);

        link.click();

        document.body.removeChild(link);


        setTimeout(()=>{

          URL.revokeObjectURL(url);

        },1000);


      },
      "image/png"
    );

  }
  catch(error){

    console.error(
      "Image error:",
      error
    );

    alert(
      "Зураг үүсгэхэд алдаа гарлаа."
    );

  }

}


/* =====================================================
   ESCAPE
===================================================== */

function escapeJs(s){

  return s
    .replace(/\\/g,"\\\\")
    .replace(/'/g,"\\'");

}


function escapeHtml(s){

  return s
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

   FIREBASE STUDENTS
===================================================== */

studentsRef.on(
  "value",
  snap => {

    const val =
      snap.val();


    if(
      Array.isArray(val) &&
      val.length
    ){

      students = val;

    }
    else if(!val){

      students =
        [...initialStudents];

      studentsRef.set(
        students
      );

    }
    else{

      students =
        Object.values(val);

    }


    dataReady = true;

    renderAttendance();

    renderAdmin();

  },
  err => {

    console.error(err);

    alert(
      "Firebase database-тэй холбогдож чадсангүй. Firebase Rules болон database URL-ээ шалгана уу."
    );

  }
);
